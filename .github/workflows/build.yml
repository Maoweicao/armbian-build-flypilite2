name: Build Armbian Images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!config/boards/fly-h3.*'
      - '!config/kernel/**'
      - '!config/bootenv/fly-h3.txt'
      - '!overlay/sun8i-h3/**'
      - '!patch/kernel/archive/sunxi-*/**'
  pull_request:
    branches: [main]
    paths:
      - 'config/boards/fly-h3.*'
      - 'config/kernel/**'
      - 'config/bootenv/fly-h3.txt'
      - 'overlay/sun8i-h3/**'
      - 'patch/kernel/archive/sunxi-*/**'
  workflow_dispatch:
    inputs:
      board:
        description: 'Board to build'
        required: false
        default: 'fly-h3'
        type: choice
        options:
          - fly-h3
          - orangepizero3
          - orangepizero2w
          - longanpi-3h
      release:
        description: 'Ubuntu/Debian release'
        required: false
        default: 'noble'
        type: choice
        options:
          - noble
          - trixie
          - bookworm
          - oracular
      branch:
        description: 'Kernel branch'
        required: false
        default: 'current'
        type: choice
        options:
          - current
          - edge

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: fly-h3
            branch: current
            release: noble
          - board: fly-h3
            branch: current
            release: trixie

    steps:
      - name: Checkout build framework
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set board variables
        id: vars
        run: |
          BOARD='${{ matrix.board }}'
          RELEASE='${{ matrix.release }}'
          BRANCH='${{ matrix.branch }}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BOARD='${{ github.event.inputs.board }}'
            RELEASE='${{ github.event.inputs.release }}'
            BRANCH='${{ github.event.inputs.branch }}'
          fi
          echo "board=${BOARD}" >> $GITHUB_OUTPUT
          echo "release=${RELEASE}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Compile Armbian image
        id: compile
        run: |
          ./compile.sh \
            BOARD="${{ steps.vars.outputs.board }}" \
            BRANCH="${{ steps.vars.outputs.branch }}" \
            RELEASE="${{ steps.vars.outputs.release }}" \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no

      - name: Find built images
        id: find
        if: success()
        run: |
          IMG_DIR="output/images"
          IMAGES=$(find "$IMG_DIR" -type f \
            \( -name "*.img.xz" -o -name "*.img" -o -name "*.img.gz" \) \
            -printf '%f\n' 2>/dev/null || true)
          echo "Found images: $IMAGES"
          {
            echo "images<<EOF"
            echo "$IMAGES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Upload images as artifacts
        if: steps.find.outputs.images != ''
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ steps.vars.outputs.board }}-${{ steps.vars.outputs.release }}
          path: output/images/
          retention-days: 7

      - name: Upload SHA256 checksums
        if: steps.find.outputs.images != ''
        run: |
          mkdir -p output/checksums
          cd output/images
          sha256sum *.{img,img.xz,img.gz} 2>/dev/null > ../checksums/${{ steps.vars.outputs.board }}-${{ steps.vars.outputs.release }}.sha256sum || true

      - name: Upload checksum artifacts
        if: steps.find.outputs.images != ''
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ steps.vars.outputs.board }}-${{ steps.vars.outputs.release }}-checksums
          path: output/checksums/
          retention-days: 7
