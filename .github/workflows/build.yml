name: Build Armbian Images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!config/boards/fly-h3.*'
      - '!config/boards/fly-h618.csc'
      - '!config/kernel/**'
      - '!config/bootenv/fly-h3.txt'
      - '!config/bootenv/fly-h618.txt'
      - '!overlay/sun8i-h3/**'
      - '!overlay/sun50i-h618/**'
      - '!patch/kernel/archive/sunxi-*/**'
  pull_request:
    branches: [main]
    paths:
      - 'config/boards/fly-*.*'
      - 'config/kernel/**'
      - 'config/bootenv/fly-*.txt'
      - 'overlay/sun8i-h3/**'
      - 'overlay/sun50i-h618/**'
      - 'patch/kernel/archive/sunxi-*/**'
  workflow_dispatch:
    inputs:
      board:
        description: 'Board to build (leave empty to build all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - fly-h3
          - fly-h618

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: fly-h3
            branch: current
            variant: wizard
            release: trixie
          - board: fly-h3
            branch: current
            variant: preset
            release: trixie
          - board: fly-h3
            branch: edge
            variant: wizard
            release: trixie
          - board: fly-h3
            branch: edge
            variant: preset
            release: trixie
          - board: fly-h618
            branch: edge
            variant: wizard
            release: trixie
          - board: fly-h618
            branch: edge
            variant: preset
            release: trixie

    steps:
      - name: Checkout build framework
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU binfmt
        uses: docker/setup-qemu-action@v3

      - name: Enable preset-firstrun (preset variant only)
        if: matrix.variant == 'preset'
        run: |
          echo 'enable_extension "preset-firstrun"' >> "config/boards/${{ matrix.board }}.csc"
          echo "[${{ matrix.board }}] enabled preset-firstrun extension for headless mode"

      - name: Compile Armbian image
        if: |
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.board == '' ||
          matrix.board == github.event.inputs.board
        id: compile
        run: |
          ./compile.sh \
            BOARD="${{ matrix.board }}" \
            BRANCH="${{ matrix.branch }}" \
            RELEASE="${{ matrix.release }}" \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no

      - name: Find built images
        if: success() && steps.compile.outcome != 'skipped'
        id: find
        run: |
          IMG_DIR="output/images"
          IMAGES=$(find "$IMG_DIR" -type f \
            \( -name "*.img.xz" -o -name "*.img" -o -name "*.img.gz" \) \
            -printf '%f\n' 2>/dev/null || true)
          echo "Found images: $IMAGES"
          {
            echo "images<<EOF"
            echo "$IMAGES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Upload images as artifacts
        if: steps.find.outputs.images != ''
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ matrix.board }}-${{ matrix.branch }}-${{ matrix.variant }}-${{ matrix.release }}
          path: output/images/
          retention-days: 7

      - name: Upload SHA256 checksums
        if: steps.find.outputs.images != ''
        run: |
          mkdir -p output/checksums
          cd output/images
          sha256sum *.{img,img.xz,img.gz} 2>/dev/null > "../checksums/${{ matrix.board }}-${{ matrix.branch }}-${{ matrix.variant }}-${{ matrix.release }}.sha256sum" || true

      - name: Upload checksum artifacts
        if: steps.find.outputs.images != ''
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ matrix.board }}-${{ matrix.branch }}-${{ matrix.variant }}-${{ matrix.release }}-checksums
          path: output/checksums/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: |
      success() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-output
          merge-multiple: true

      - name: Generate release body
        id: body
        run: |
          cat > release-body.md << 'BODYEOF'
          ## Build Information
          - **Commit**: [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - **CI Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ## Built Images

          | Board | Kernel | Variant | Description |
          |-------|--------|---------|-------------|
          | fly-h3 | current (6.12) | wizard | First-run interactive setup wizard |
          | fly-h3 | current (6.12) | preset | Pre-configured, skip wizard |
          | fly-h3 | edge (6.18) | wizard | First-run interactive setup wizard |
          | fly-h3 | edge (6.18) | preset | Pre-configured, skip wizard |
          | fly-h618 | edge (6.18) | wizard | First-run interactive setup wizard |
          | fly-h618 | edge (6.18) | preset | Pre-configured, skip wizard |

          ## Variant Differences

          ### wizard
          - First boot launches Armbian interactive setup
          - Prompts for root password, user account, locale, timezone, network

          ### preset
          - Skips first-boot wizard (fully automated)
          - Root password: `mellow`
          - User account: `mellow` / `mellow`
          - Ethernet: DHCP enabled
          - WiFi: disabled
          - Timezone: `Asia/Shanghai`
          - Locale: `en_US.UTF-8`
          - Shell: `bash`

          ## Usage
          ```
          xzcat <image>.img.xz | dd of=/dev/sdX bs=4M status=progress
          sync
          ```

          ## Checksums
          SHA256 checksums are included in the `-checksums` artifacts and attached below.
          BODYEOF

          echo "body_file=release-body.md" >> $GITHUB_OUTPUT

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }} (${{ github.sha }})"
          body_path: release-body.md
          files: |
            release-output/**/*.img.xz
            release-output/**/*.img.gz
            release-output/**/*.sha256sum
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
