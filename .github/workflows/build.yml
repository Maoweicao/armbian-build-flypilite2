name: Build Armbian Images

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!config/boards/fly-h3.*'
      - '!config/kernel/**'
      - '!config/bootenv/fly-h3.txt'
      - '!overlay/sun8i-h3/**'
      - '!patch/kernel/archive/sunxi-*/**'
  pull_request:
    branches: [main]
    paths:
      - 'config/boards/fly-*.*'
      - 'config/kernel/**'
      - 'config/bootenv/fly-*.txt'
      - 'overlay/sun8i-h3/**'
      - 'overlay/sun50i-h618/**'
      - 'patch/kernel/archive/sunxi-*/**'
  workflow_dispatch:
    inputs:
      board:
        description: 'Board to build (leave empty to build all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - fly-h3
          - fly-h618
          - orangepizero3
          - orangepizero2w
          - longanpi-3h

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: fly-h3
            branch: current
            release: noble
          - board: fly-h3
            branch: current
            release: trixie
          - board: fly-h618
            branch: current
            release: noble
          - board: fly-h618
            branch: current
            release: trixie

    steps:
      - name: Checkout build framework
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU binfmt
        uses: docker/setup-qemu-action@v3

      - name: Compile Armbian image
        if: |
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.board == '' ||
          matrix.board == github.event.inputs.board
        id: compile
        run: |
          ./compile.sh \
            BOARD="${{ matrix.board }}" \
            BRANCH="${{ matrix.branch }}" \
            RELEASE="${{ matrix.release }}" \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no

      - name: Find built images
        if: success() && steps.compile.outcome != 'skipped'
        id: find
        run: |
          IMG_DIR="output/images"
          IMAGES=$(find "$IMG_DIR" -type f \
            \( -name "*.img.xz" -o -name "*.img" -o -name "*.img.gz" \) \
            -printf '%f\n' 2>/dev/null || true)
          echo "Found images: $IMAGES"
          {
            echo "images<<EOF"
            echo "$IMAGES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Upload images as artifacts
        if: steps.find.outputs.images != ''
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ matrix.board }}-${{ matrix.release }}
          path: output/images/
          retention-days: 7

      - name: Upload SHA256 checksums
        if: steps.find.outputs.images != ''
        run: |
          mkdir -p output/checksums
          cd output/images
          sha256sum *.{img,img.xz,img.gz} 2>/dev/null > ../checksums/${{ matrix.board }}-${{ matrix.release }}.sha256sum || true

      - name: Upload checksum artifacts
        if: steps.find.outputs.images != ''
        uses: actions/upload-artifact@v4
        with:
          name: armbian-${{ matrix.board }}-${{ matrix.release }}-checksums
          path: output/checksums/
          retention-days: 7
